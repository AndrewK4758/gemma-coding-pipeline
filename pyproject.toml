[project]
name = "gemma-coding-pipeline"
version = "0.1.0"
description = "Gemma 4 E4B / Gemma 2 9B coding fine-tuning, compiler-verified DPO/GRPO, and GGUF export pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7.0",
    "transformers>=4.50.0",
    "peft>=0.15.0",
    "trl>=0.16.0",
    "accelerate>=1.5.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0",
    "datasketch>=1.6.0",
    "tensorboard>=2.18.0",
    "rich>=13.9.0",
    "pyarrow>=18.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.28.0",
    "safetensors>=0.5.0",
    "huggingface_hub>=0.29.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
